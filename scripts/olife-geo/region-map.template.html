<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>권역별 시청률 지도</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --ink: #1c2330; --sub: #5d6778; --line: #dfe3ea;
  --land: #e4e8ee; --land-line: #ffffff;
  --nat: #4f9a68; --cul: #7a64b0; --both: #3fa7a7; --none: #c3c8d1;
  --up: #1f6fb8; --mid: #cfd3da; --down: #e07b39;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141922; --panel: #1c2330; --ink: #e8ebf1; --sub: #98a2b3; --line: #2c3545;
    --land: #2a3342; --land-line: #1c2330; --none: #5b6474; --mid: #5b6474;
  }
}
:root[data-theme="dark"] {
  --bg: #141922; --panel: #1c2330; --ink: #e8ebf1; --sub: #98a2b3; --line: #2c3545;
  --land: #2a3342; --land-line: #1c2330; --none: #5b6474; --mid: #5b6474;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }
.wrap { max-width: 1320px; margin: 0 auto; padding: 20px 16px 32px; }
h1 { font-size: 20px; margin: 0 0 4px; }
.sub { color: var(--sub); font-size: 13px; margin: 0 0 14px; line-height: 1.5; }
.grid { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 14px; }
@media (max-width: 960px) { .grid { grid-template-columns: 1fr; } }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
.ctrl { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; font-size: 13px; color: var(--sub); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: transparent; color: var(--ink); padding: 5px 10px; font: inherit; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--up); color: #fff; }
#map { width: 100%; height: auto; display: block; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--sub); margin-top: 8px; align-items: center; }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
.ramp { width: 120px; height: 10px; border-radius: 5px; background: linear-gradient(90deg, var(--down), var(--mid), var(--up)); display: inline-block; vertical-align: middle; }
.pie { cursor: pointer; }
.pie .ring { fill: none; stroke-width: 5; }
.pie.sel .ring { stroke-width: 7; }
.pie text { font-size: 11px; fill: var(--ink); paint-order: stroke; stroke: var(--panel); stroke-width: 3px; text-anchor: middle; pointer-events: none; }
.lead { stroke: var(--sub); stroke-width: 1; opacity: .5; }
#tip { position: fixed; pointer-events: none; background: var(--ink); color: var(--bg); padding: 6px 9px; border-radius: 6px; font-size: 12px; line-height: 1.45; opacity: 0; transition: opacity .1s; z-index: 5; }
h2 { font-size: 15px; margin: 0 0 8px; }
.rank { list-style: none; margin: 0; padding: 0; font-size: 13px; }
.rank li { display: grid; grid-template-columns: 96px 1fr 46px; gap: 6px; align-items: center; padding: 3px 0; cursor: pointer; }
.rank li.sel { font-weight: 700; }
.rank .bar { height: 8px; border-radius: 4px; background: var(--line); position: relative; }
.rank .bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; }
.rank .v { text-align: right; font-variant-numeric: tabular-nums; }
.rank .ref { color: var(--sub); font-size: 11px; }
.detail { font-size: 13px; line-height: 1.6; margin-top: 12px; border-top: 1px solid var(--line); padding-top: 10px; }
.detail b { font-weight: 700; }
.chip { display: inline-block; padding: 1px 7px; border-radius: 10px; background: var(--line); margin: 1px 2px 1px 0; font-size: 12px; }
.note { font-size: 12px; color: var(--sub); line-height: 1.55; margin-top: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>권역별 시청률 성과 지도</h1>
  <p class="sub" id="sub"></p>
  <div class="grid">
    <div class="card">
      <div class="ctrl">
        <span>링 색 기준</span>
        <span class="seg" role="group" aria-label="링 색 기준">
          <button id="mM" aria-pressed="true">월보정지수</button>
          <button id="mS" aria-pressed="false">슬롯지수</button>
        </span>
        <span>· 원을 누르면 오른쪽에 상세가 나옵니다</span>
      </div>
      <svg id="map" viewBox="0 40 1200 520" role="img" aria-label="세계지도 위 권역별 원형 그래프"></svg>
      <div class="legend">
        <span>원 크기 = 방송수</span>
        <span>링 색: 낮음 <span class="ramp"></span> 높음 (1.0 = 같은 자리 평균)</span>
        <span><i class="sw" style="background:var(--nat)"></i>자연 테마만</span>
        <span><i class="sw" style="background:var(--cul)"></i>문화 테마만</span>
        <span><i class="sw" style="background:var(--both)"></i>둘 다</span>
        <span><i class="sw" style="background:var(--none)"></i>테마 분류 없음</span>
        <span>점선·흐린 원 = 방송 3건 미만(참고용)</span>
      </div>
    </div>
    <div class="card">
      <h2>권역 순위 <span class="ref" id="rankTitle"></span></h2>
      <ul class="rank" id="rank"></ul>
      <div class="detail" id="detail">원이나 순위 항목을 누르세요.</div>
      <p class="note">지수는 같은 프로그램·요일·시간대(월보정은 같은 달까지) 평균 대비 비율입니다. 2026-07 이후 부제가 분류와 맞은 방송만 집계했고, 여름·가을 자료뿐이라 계절 결론은 이릅니다.</p>
    </div>
  </div>
</div>
<div id="tip"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<script>
const DATA = __DATA__;
// 권역 대표 좌표(경도, 위도) — 실제 위치. 겹치면 충돌 회피로 원만 옮기고 선으로 잇는다.
const POS = {
  "동아시아": [112, 36], "동남아시아": [105, 14], "남아시아": [79, 23], "중앙아시아": [66, 42], "중동": [45, 29],
  "코카서스": [44.5, 41.5], "러시아": [95, 60], "북유럽": [16, 63], "서유럽": [2, 47], "남유럽": [13, 41.5], "중·동유럽": [22, 50],
  "북미": [-100, 45], "중미·카리브": [-80, 17], "남미": [-60, -14], "북아프리카": [10, 28], "서아프리카": [-3, 10],
  "동아프리카": [37, 2], "남부아프리카": [24, -21], "오세아니아": [134, -25], "태평양 섬": [-165, -10]
};
const regions = DATA.regions.filter(r => POS[r.name]);
document.getElementById("sub").textContent =
  `OLIFE <걸어서 세계속으로>·<세계테마기행> · ${DATA.period} · ${DATA.target} · 방송 ${regions.reduce((a, r) => a + r.n, 0)}건(여러 권역 방송은 중복 집계)`;

let mode = "idxM";
const W = 1200, H = 600;
const svg = d3.select("#map");
const proj = d3.geoNaturalEarth1().scale(210).translate([W / 2, H / 2 + 20]);
const path = d3.geoPath(proj);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const color = d3.scaleLinear().domain([0.75, 1, 1.15]).clamp(true);
function ringColor(v) { color.range([css("--down"), css("--mid"), css("--up")]); return color(v); }
const rad = r => 9 + 3.1 * Math.sqrt(r.n);

fetch("https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json").then(r => r.json()).then(topo => {
  const land = topojson.feature(topo, topo.objects.countries);
  svg.append("g").selectAll("path").data(land.features.filter(f => f.id !== "010")).join("path").attr("d", path)
    .attr("fill", "var(--land)").attr("stroke", "var(--land-line)").attr("stroke-width", .5);
  layout(); draw();
}).catch(() => { layout(); draw(); d3.select("#sub").append("span").text(" (지도 윤곽을 불러오지 못했습니다 — 인터넷 연결 확인)"); });

// 충돌 회피 배치: 실제 위치(anchor)에서 시작해 서로 겹치지 않게 밀어낸다.
let nodes = [];
function layout() {
  nodes = regions.map(r => { const [x, y] = proj(POS[r.name]); return { r, ax: x, ay: y, x, y, rad: rad(r) + 7 }; });
  const sim = d3.forceSimulation(nodes)
    .force("x", d3.forceX(d => d.ax).strength(.12)).force("y", d3.forceY(d => d.ay).strength(.12))
    .force("c", d3.forceCollide(d => d.rad + 3).iterations(4)).stop();
  for (let i = 0; i < 400; i++) sim.tick();
  nodes.forEach(n => { n.x = Math.max(n.rad, Math.min(W - n.rad, n.x)); n.y = Math.max(n.rad, Math.min(H - n.rad, n.y)); });
}

let selected = null;
const tip = document.getElementById("tip");
function draw() {
  svg.selectAll(".layer").remove();
  const g = svg.append("g").attr("class", "layer");
  g.selectAll("line").data(nodes.filter(n => Math.hypot(n.x - n.ax, n.y - n.ay) > n.rad)).join("line").attr("class", "lead")
    .attr("x1", d => d.ax).attr("y1", d => d.ay).attr("x2", d => d.x).attr("y2", d => d.y);
  g.selectAll("circle.anchor").data(nodes).join("circle").attr("class", "anchor").attr("r", 2.5).attr("cx", d => d.ax).attr("cy", d => d.ay).attr("fill", "var(--sub)");
  const p = g.selectAll("g.pie").data(nodes).join("g").attr("class", d => "pie" + (selected === d.r.name ? " sel" : ""))
    .attr("transform", d => `translate(${d.x},${d.y})`).style("opacity", d => d.r.sample ? 1 : .55)
    .on("click", (e, d) => select(d.r.name))
    .on("mousemove", (e, d) => showTip(e, d.r)).on("mouseleave", () => tip.style.opacity = 0);
  const arc = d3.arc(), pie = d3.pie().sort(null).value(d => d.v);
  p.each(function (d) {
    const r = d.r, ro = rad(r);
    const parts = [{ v: r.natureOnly, c: "--nat" }, { v: r.cultureOnly, c: "--cul" }, { v: r.both, c: "--both" }, { v: r.neither, c: "--none" }].filter(x => x.v > 0);
    const gg = d3.select(this);
    gg.selectAll("path").data(pie(parts)).join("path").attr("d", a => arc.innerRadius(0).outerRadius(ro)(a)).attr("fill", a => `var(${a.data.c})`).attr("stroke", "var(--panel)").attr("stroke-width", 1);
    gg.append("circle").attr("class", "ring").attr("r", ro + 3.5).attr("stroke", ringColor(r[mode])).attr("stroke-dasharray", r.sample ? null : "3 3");
    gg.append("text").attr("y", ro + 18).text(`${r.name} ${r[mode].toFixed(2)}`);
  });
}
function showTip(e, r) {
  tip.innerHTML = `<b>${r.name}</b><br>월보정지수 ${r.idxM.toFixed(2)} · 슬롯지수 ${r.idx.toFixed(2)}<br>방송 ${r.n}건 · 회차 ${r.episodes}편 · 평균 ${r.rating.toFixed(3)}%${r.sample ? "" : "<br>표본 적음(참고용)"}`;
  tip.style.opacity = 1; tip.style.left = Math.min(innerWidth - 230, e.clientX + 14) + "px"; tip.style.top = (e.clientY + 14) + "px";
}
function select(name) { selected = name; draw(); renderRank(); renderDetail(); }
function renderRank() {
  const rs = [...regions].sort((a, b) => b[mode] - a[mode]);
  document.getElementById("rankTitle").textContent = mode === "idxM" ? "(월보정지수)" : "(슬롯지수)";
  const ul = d3.select("#rank");
  ul.selectAll("li").remove();
  rs.forEach(r => {
    const li = ul.append("li").attr("class", selected === r.name ? "sel" : "").on("click", () => select(r.name));
    li.append("span").text(r.name);
    li.append("span").attr("class", "bar").append("i").style("width", Math.max(4, Math.min(100, (r[mode] - 0.6) / 0.6 * 100)) + "%").style("background", ringColor(r[mode])).style("opacity", r.sample ? 1 : .45);
    li.append("span").attr("class", "v").html(r[mode].toFixed(2) + (r.sample ? "" : '<span class="ref">*</span>'));
  });
}
function renderDetail() {
  const r = regions.find(x => x.name === selected); const el = document.getElementById("detail");
  if (!r) return;
  const chips = a => a.length ? a.map(([t, n]) => `<span class="chip">${t} ${n}</span>`).join("") : "-";
  el.innerHTML = `<b>${r.name}</b> — 방송 ${r.n}건, 회차 ${r.episodes}편, 평균 시청률 ${r.rating.toFixed(3)}%${r.sample ? "" : " (참고용)"}<br>` +
    `월보정지수 <b>${r.idxM.toFixed(2)}</b> · 슬롯지수 <b>${r.idx.toFixed(2)}</b><br>` +
    `자연 테마 ${chips(r.topNature)}<br>문화 테마 ${chips(r.topCulture)}<br>` +
    `주요 국가 ${r.countries.map(c => `<span class="chip">${c.name} ${c.n}건·${c.idxM.toFixed(2)}</span>`).join("")}`;
}
function setMode(m) {
  mode = m;
  document.getElementById("mM").setAttribute("aria-pressed", m === "idxM"); document.getElementById("mS").setAttribute("aria-pressed", m === "idx");
  draw(); renderRank();
}
document.getElementById("mM").onclick = () => setMode("idxM");
document.getElementById("mS").onclick = () => setMode("idx");
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { draw(); renderRank(); });
renderRank();
</script>
</body>
</html>
