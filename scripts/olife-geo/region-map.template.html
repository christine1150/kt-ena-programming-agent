<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OLIFE 시청률 지도</title>
<style>
/* KT Flow 글꼴(앱의 public/ena-design/fonts). 앱 화면에서만 불러와지고, 내려받은 단독 HTML에서는 대체 글꼴로 보인다 */
@font-face { font-family: "KT Flow"; src: url("/ena-design/fonts/KTFLOW-THIN.ttf") format("truetype"); font-weight: 100 399; font-display: swap; }
@font-face { font-family: "KT Flow"; src: url("/ena-design/fonts/KTFLOW-MEDIUM.ttf") format("truetype"); font-weight: 400 599; font-display: swap; }
@font-face { font-family: "KT Flow"; src: url("/ena-design/fonts/KTFLOW-BOLD.ttf") format("truetype"); font-weight: 600 749; font-display: swap; }
@font-face { font-family: "KT Flow"; src: url("/ena-design/fonts/KTFLOW-BLACK.ttf") format("truetype"); font-weight: 750 900; font-display: swap; }
/* 색 원칙: 바탕·땅은 무채색, 색은 '평균 대비 성과' 한 가지에만 쓴다.
   높음=남색·낮음=장미색은 앱 증감색(src/lib/ui/tokens.ts up/down)과 같은 방향. 가운데(평균 수준)는 회색.
   테마(자연·문화·시기) 색은 성과색(파랑·빨강)과 겹치지 않는 밝은 초록·노랑·하늘 계열. */
:root {
  --bg: #f3f4f6; --surface: #ffffff; --line: #e4e7ec; --line2: #cfd4dc;
  --ink: #111827; --sub: #4b5563; --muted: #8a919c;
  --ocean: #f8f9fb; --land: #e3e7ed; --land-line: #ffffff;
  --c-vh: #281fc7; --c-h: #8a8cf2; --c-n: #b8bdc7; --c-l: #ee7f96; --c-vl: #9f1239;
  --up: #281fc7; --down: #be123c; --top: #2563eb;
  --t-nat: #34d399; --t-cul: #facc15; --t-both: #a3e635; --t-sea: #22d3ee; --none: #e5e7eb;
  --hover: #f3f4f6; --sel: #eef0ff; --shadow: 0 6px 24px rgba(17, 24, 39, .10);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d0f13; --surface: #171a21; --line: #272c36; --line2: #363c48;
    --ink: #f1f3f6; --sub: #b4bac5; --muted: #7f8794;
    --ocean: #12151b; --land: #262b35; --land-line: #12151b;
    --c-vh: #a5a8ff; --c-h: #5a56d6; --c-n: #5c6370; --c-l: #a3405a; --c-vl: #fb7185;
    --up: #a5a8ff; --down: #fb7185; --top: #3b82f6;
    --t-nat: #34d399; --t-cul: #fde047; --t-both: #bef264; --t-sea: #67e8f9; --none: #3a404b;
    --hover: #1f232c; --sel: #23264a; --shadow: 0 8px 28px rgba(0, 0, 0, .5);
  }
}
:root[data-theme="dark"] {
  --bg: #0d0f13; --surface: #171a21; --line: #272c36; --line2: #363c48;
  --ink: #f1f3f6; --sub: #b4bac5; --muted: #7f8794;
  --ocean: #12151b; --land: #262b35; --land-line: #12151b;
  --c-vh: #a5a8ff; --c-h: #5a56d6; --c-n: #5c6370; --c-l: #a3405a; --c-vl: #fb7185;
  --up: #a5a8ff; --down: #fb7185; --top: #3b82f6;
  --t-nat: #34d399; --t-cul: #fde047; --t-both: #bef264; --t-sea: #67e8f9; --none: #3a404b;
  --hover: #1f232c; --sel: #23264a; --shadow: 0 8px 28px rgba(0, 0, 0, .5);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { overflow-x: clip; overscroll-behavior: none; }
body { margin: 0; color: var(--ink); background: var(--bg); font-family: "KT Flow", "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; font-size: 13px; }
.num { font-variant-numeric: tabular-nums; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.wrap { padding: 6px 8px; }

/* 머리: 낮은 한 줄(좁은 화면에서는 두 줄로 접힌다) — 지도에 높이를 최대한 준다 */
.top { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; padding: 4px 8px 4px 12px; margin-bottom: 6px; }
.top h1 { font-size: 15px; font-weight: 800; letter-spacing: -.02em; margin: 0 4px 0 0; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
.info { font-size: 13px; font-weight: 500; color: var(--muted); border: 0 !important; }
.vsep { width: 1px; height: 18px; background: var(--line2); }
.fl { display: inline-flex; align-items: center; gap: 5px; color: var(--muted); font-size: 11px; white-space: nowrap; }
.seg { display: inline-flex; padding: 2px; border-radius: 7px; background: var(--hover); border: 1px solid var(--line); }
.seg button { border: 0; background: transparent; color: var(--sub); font: inherit; font-size: 12px; padding: 2px 6px; border-radius: 5px; cursor: pointer; white-space: nowrap; }
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 700; box-shadow: 0 1px 2px rgba(17, 24, 39, .12), 0 0 0 1px var(--line); }
.seg button.term::after { content: "ⓘ"; font-size: 10px; margin-left: 3px; opacity: .5; }
select.sl { font: inherit; font-size: 12px; color: var(--ink); background: var(--surface); border: 1px solid var(--line2); border-radius: 7px; padding: 2px 6px; cursor: pointer; height: 26px; }
select.target { margin-left: auto; font-weight: 700; }
.pill { border: 1px solid var(--ink); background: var(--ink); color: var(--surface); font: inherit; font-size: 11.5px; font-weight: 700; padding: 2px 9px; border-radius: 999px; cursor: pointer; }
.reset { border: 0; background: none; font: inherit; font-size: 11.5px; color: var(--c-vh); cursor: pointer; padding: 2px; text-decoration: underline; text-underline-offset: 2px; }

/* 본문: 지도 왼쪽(최대한 크게) + 오른쪽 패널. 지도 칸 높이는 지도 비율에 맞춰 fitStage()가 정한다. 패널을 접으면 지도가 너비 가득 */
.stage { display: grid; grid-template-columns: minmax(0, 1fr) clamp(330px, 24vw, 460px); gap: 6px; align-items: start; }
.stage.wide { grid-template-columns: minmax(0, 1fr); }
.stage.wide .side { display: none; }
.lcol { display: flex; flex-direction: column; min-width: 0; }
.mapcard { position: relative; overflow: hidden; background: var(--ocean); }
.mapbox { position: absolute; inset: 0; }
#map { width: 100%; height: 100%; display: block; touch-action: none; overscroll-behavior: contain; }
#map.zoomed { cursor: grab; }
#map.zoomed:active { cursor: grabbing; }
kbd { font: inherit; font-size: 10.5px; padding: 0 5px; border-radius: 4px; border: 1px solid var(--line2); background: var(--surface); color: var(--sub); }

/* 범례: 지도 맨 아래 왼쪽에 얇게(남극해 띠 — 원이 없다). 색 단계는 눌러서 그 단계만 볼 수 있다. 나머지 설명은 '보는 법'에 */
.mleg { position: absolute; left: 8px; bottom: 8px; max-width: calc(100% - 200px); display: flex; align-items: center; gap: 2px 4px; flex-wrap: wrap; padding: 2px 10px 2px 8px; border-radius: 999px; font-size: 11.5px; color: var(--sub); background: color-mix(in srgb, var(--surface) 92%, transparent); box-shadow: var(--shadow); }
.mleg .lt { font-weight: 700; color: var(--ink); margin-right: 4px; white-space: nowrap; }
.lrow { display: inline-flex; align-items: center; gap: 5px; border: 1px solid transparent; background: none; font: inherit; font-size: 11.5px; color: var(--ink); padding: 2px 8px 2px 6px; border-radius: 999px; cursor: pointer; white-space: nowrap; }
.lrow:hover { background: var(--hover); }
.lrow[aria-pressed="true"] { border-color: var(--ink); font-weight: 700; }
.lrow .sw { width: 10px; height: 10px; border-radius: 50%; }
.lrow .cnt { color: var(--muted); }
.lhelp { margin-left: 4px; white-space: nowrap; color: var(--muted); }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 4px; vertical-align: -1px; }

/* 지도 컨트롤·현재 위치. 확대 버튼은 오른쪽 아래(남대서양 — 원이 없는 바다)에 가로로 둔다(오른쪽 위는 그린란드 자리) */
.mapctl { position: absolute; bottom: 10px; right: 10px; display: flex; flex-direction: row; overflow: hidden; box-shadow: var(--shadow); }
.mapctl button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.mapctl button { width: 32px; height: 30px; border: 0; border-right: 1px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; font-size: 17px; font-weight: 700; line-height: 1; cursor: pointer; }
.mapctl button:last-child { border-right: 0; }
.mapctl button:hover:not(:disabled) { background: var(--hover); }
.mapctl button:disabled { color: var(--line2); cursor: default; }
.crumb { position: absolute; top: 10px; left: 10px; display: flex; align-items: center; gap: 10px; padding: 4px 14px 4px 4px; font-weight: 700; box-shadow: var(--shadow); }
.crumb button { border: 0; font: inherit; font-weight: 700; color: var(--surface); background: var(--ink); padding: 6px 12px; border-radius: 8px; cursor: pointer; }
button:focus-visible, .term:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--c-vh); outline-offset: 2px; }

/* 지도 표식 */
.pie { cursor: pointer; transition: opacity .15s; }
.pie.dim { opacity: .12; }
.lbl { transition: opacity .15s; }
.lbl.dim { opacity: .12; }
.pie text, .lbl { font-size: 11px; font-weight: 700; fill: var(--ink); paint-order: stroke; stroke: var(--ocean); stroke-width: 3px; stroke-linejoin: round; text-anchor: middle; pointer-events: none; }
.pie .rk circle { fill: var(--top); stroke: var(--surface); stroke-width: 2; }
.pie .rk text { fill: #fff; stroke: none; font-size: 10.5px; font-weight: 800; dominant-baseline: central; }
.lead { stroke: var(--muted); stroke-width: 1; opacity: .5; }

/* 오른쪽 패널 */
.side { display: flex; flex-direction: column; min-height: 0; padding: 10px 12px; gap: 10px; overflow: hidden; }
.search { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line2); border-radius: 8px; padding: 5px 10px; flex: none; background: var(--surface); }
.search input { border: 0; outline: 0; background: transparent; font: inherit; font-size: 12.5px; color: var(--ink); width: 100%; }
/* 테마 칩: 여러 줄로 감싸고 위아래로 스크롤. 2줄 반(줄 간격 27px × 2 + 칩 절반)만 보여 아래에 더 있다는 게 드러나게 */
.chips { display: flex; flex-wrap: wrap; align-content: flex-start; gap: 4px; max-height: 66px; overflow-y: auto; overflow-x: hidden; flex: none; margin-top: -4px; padding-right: 2px; scrollbar-width: thin; scrollbar-color: var(--line2) transparent; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); font: inherit; font-size: 11.5px; padding: 2px 8px; border-radius: 999px; cursor: pointer; color: var(--ink); white-space: nowrap; }
.chip:hover { border-color: var(--line2); background: var(--hover); }
.chip b { font-weight: 700; }
.chip small { color: var(--muted); }
.chip::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: 0; }
.chip.N::before { background: var(--t-nat); }
.chip.C::before { background: var(--t-cul); }
.chip.S::before { background: var(--t-sea); }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.chip[aria-pressed="true"] small { color: inherit; opacity: .7; }

.kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; flex: none; }
.kpi { border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; min-width: 0; }
.kpi .t { font-size: 10.5px; color: var(--muted); }
.kpi .v { font-size: 16px; font-weight: 800; letter-spacing: -.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi .s { font-size: 10.5px; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.sec { display: flex; flex-direction: column; min-height: 0; }
.sec.rk { flex: 5 1 0; }
.sec.ep { flex: 4 1 0; }
.sec h2 { font-size: 13px; font-weight: 800; margin: 0 0 6px; flex: none; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.sec h2 .ref { flex: 1 1 auto; min-width: 0; }
.ref { font-size: 11px; font-weight: 500; color: var(--muted); }
.mini { font: inherit; font-size: 11.5px; color: var(--ink); background: var(--surface); border: 1px solid var(--line2); border-radius: 6px; padding: 2px 6px; cursor: pointer; }
.mini:hover { background: var(--hover); }
.axis { display: grid; grid-template-columns: 22px 86px minmax(0, 1fr) 58px 46px; gap: 8px; font-size: 10px; color: var(--muted); padding: 0 6px 4px; border-bottom: 1px solid var(--line); flex: none; }
.axis .ax { display: flex; justify-content: space-between; }
.rank, .eps { list-style: none; margin: 0; padding: 0; flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; scrollbar-gutter: stable; }
.rank li { display: grid; grid-template-columns: 22px 86px minmax(0, 1fr) 58px 46px; gap: 8px; align-items: center; padding: 4px 6px; border-radius: 6px; cursor: pointer; font-size: 12.5px; }
.rank li:hover { background: var(--hover); }
.rank li.sel { background: var(--sel); font-weight: 700; }
.rank li.dim { opacity: .3; }
.rank li.few { color: var(--muted); }
.rank li.sep { display: block; cursor: default; padding: 8px 6px 2px; font-size: 10.5px; color: var(--muted); border-top: 1px dashed var(--line2); margin-top: 4px; }
.rank li.sep:hover { background: none; }
.rank li.empty { display: block; cursor: default; color: var(--muted); padding: 12px 6px; }
.rank .no { color: var(--muted); text-align: right; font-size: 11px; }
.rank .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rank .nm small { color: var(--muted); font-size: 10.5px; margin-left: 3px; }
.dbar { display: block; position: relative; height: 12px; }
.dbar::before { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--line2); }
.dbar i { position: absolute; top: 0; bottom: 0; }
.dbar i.pos { border-radius: 0 3px 3px 0; }
.dbar i.neg { border-radius: 3px 0 0 3px; }
.val { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.dl { font-size: 11px; font-weight: 700; text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.dl.u { color: var(--up); }
.dl.d { color: var(--down); }
.dl.z { color: var(--muted); font-weight: 500; }

.eps li { display: grid; grid-template-columns: 20px auto minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 5px 6px; border-radius: 6px; font-size: 12.5px; }
.eps li:hover { background: var(--hover); }
.eps .no { color: var(--muted); text-align: right; font-size: 11px; }
.eps .tt { min-width: 0; }
.eps .tt div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.eps .tt .m { font-size: 11px; color: var(--muted); }
.eps .vv { text-align: right; }
.eps .vv .dl { display: block; }
.prog { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 4px; white-space: nowrap; border: 1px solid var(--ink); }
.prog.걸세 { background: var(--ink); color: var(--surface); }
.prog.세테기 { background: transparent; color: var(--ink); }

/* 툴팁 */
#tip, #termTip { position: fixed; pointer-events: none; opacity: 0; transition: opacity .1s; z-index: 6; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); font-size: 12.5px; line-height: 1.55; }
#tip { max-width: 440px; padding: 10px 14px; }
#termTip { max-width: 320px; padding: 10px 12px; }
#termTip .hl { display: block; margin-top: 4px; }
#tip .hd { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
#tip .hd b { font-size: 15px; }
.cchip { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 700; padding: 1px 8px 1px 6px; border-radius: 999px; border: 1px solid var(--line); }
.cchip i { width: 9px; height: 9px; border-radius: 50%; }
#tip .st { color: var(--sub); }
#tip .h { font-size: 11px; color: var(--muted); margin-top: 8px; padding-top: 6px; border-top: 1px solid var(--line); }
#tip .eg { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; gap: 2px 8px; align-items: baseline; }
#tip .e { display: contents; }
#tip .e b { text-align: right; white-space: nowrap; }
#tip .e span:nth-child(2) { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#tip .e span:nth-child(3) { white-space: nowrap; text-align: right; font-variant-numeric: tabular-nums; }
span.term { border-bottom: 1px dotted var(--muted); cursor: help; }
.term { cursor: help; }

@media (min-width: 1500px) {
  body, .rank li, .eps li, .search input { font-size: 13.5px; }
  .top h1 { font-size: 16px; }
  .seg button, select.sl { font-size: 12.5px; }
  .kpi .v { font-size: 18px; }
  .mleg, .lrow { font-size: 12px; }
  .pie text { font-size: 12.5px; }
}
/* 좁은 화면: 한 줄로 쌓는다 */
@media (max-width: 1000px) {
  .stage { display: block; }
  .mapcard { height: 60vh !important; min-height: 300px; }
  .side { height: auto !important; margin-top: 8px; }
  .side .rank, .side .eps { max-height: 360px; }
  .sec.rk, .sec.ep { flex: none; }
  .mleg { max-width: calc(100% - 16px); bottom: 46px; }
  #panel { display: none; }
}
@media (max-width: 560px) {
  .kpis { grid-template-columns: 1fr 1fr; }
  .rank li, .axis { grid-template-columns: 20px 72px minmax(0, 1fr) 54px 42px; gap: 6px; }
  select.target { margin-left: 0; }
}
</style>
</head>
<body>
<div class="wrap">
  <!-- 머리: 한 줄(좁으면 두 줄). 버튼 글자만으로 뜻이 통하는 곳은 앞 이름표를 빼고 마우스를 올리면 이름이 뜨게 둔다 -->
  <div class="top card">
    <h1>OLIFE 시청률 지도<span class="term info" tabindex="0" data-term="data" aria-label="데이터 안내">ⓘ</span></h1>
    <span class="seg" role="group" aria-label="프로그램" title="프로그램"><button data-prog="all" aria-pressed="true">전체</button><button data-prog="걸세" aria-pressed="false" title="걸어서 세계속으로">걸세</button><button data-prog="세테기" aria-pressed="false" title="세계테마기행">세테기</button></span>
    <span class="seg" role="group" aria-label="보기 단위" title="보기 단위"><button data-view="country" aria-pressed="true">국가</button><button data-view="region" aria-pressed="false">권역</button></span>
    <span class="seg" role="group" aria-label="순위·색 기준"><button data-mode="r" aria-pressed="true" class="term" data-term="r">시청률</button><button data-mode="m" aria-pressed="false" class="term" data-term="m">월보정지수</button><button data-mode="i" aria-pressed="false" class="term" data-term="i">슬롯지수</button></span>
    <span class="vsep" aria-hidden="true"></span>
    <span class="seg" role="group" aria-label="기간" title="기간"><button data-per="all" aria-pressed="true">전 기간</button><button data-per="12" aria-pressed="false">최근 1년</button><button data-per="6" aria-pressed="false">최근 6개월</button></span>
    <span class="seg" role="group" aria-label="요일" title="요일"><button data-day="all" aria-pressed="true">전 요일</button><button data-day="wk" aria-pressed="false">평일</button><button data-day="we" aria-pressed="false">주말</button></span>
    <select id="band" class="sl" aria-label="시간대" title="시간대"><option value="">전 시간대</option></select>
    <span class="fl" title="방송 횟수가 이만큼 넘는 곳만 지도·순위에 표시">방송 <span class="seg" role="group" aria-label="최소 방송 횟수"><button data-min="0" aria-pressed="true">전체</button><button data-min="5" aria-pressed="false">5회+</button><button data-min="10" aria-pressed="false">10회+</button><button data-min="20" aria-pressed="false">20회+</button></span></span>
    <select id="reg" class="sl" aria-label="권역" title="권역"><option value="">전 권역</option></select>
    <button class="reset" id="reset" hidden>조건 초기화</button>
    <button id="themeOn" class="pill" hidden></button>

const CPOS = {

  "브라질": [-52, -10], "오스트리아": [14.5, 47.5], "캄보디아": [105, 12.5], "스리랑카": [80.7, 7.8], "세네갈": [-14.5, 14.5], "타이완": [121, 23.7],
  "페루": [-75, -10], "크로아티아": [16, 45.2], "짐바브웨": [30, -19], "영국": [-2, 54], "싱가포르": [103.8, 1.35], "그리스": [22, 39],
  "튀니지": [9.5, 34], "가나": [-1.2, 7.9], "몰타": [14.4, 35.9], "슬로베니아": [14.8, 46.1], "에콰도르": [-78, -1.5], "캐나다": [-106, 56],
  "핀란드": [26, 64], "말레이시아": [102, 4], "독일": [10.4, 51], "요르단": [36.5, 31], "부탄": [90.4, 27.4], "보츠와나": [24, -22],
  "이스라엘": [35, 31.4], "타지키스탄": [71, 38.8], "덴마크": [10, 56], "프랑스": [2.3, 46.6], "잠비아": [27.8, -13.1], "오만": [57, 21],
  "탄자니아": [35, -6.4], "에티오피아": [40, 9], "헝가리": [19.5, 47], "라트비아": [24.6, 56.9], "조지아": [43.5, 42.2], "우루과이": [-56, -33],
  "홍콩": [114.2, 22.3], "말라위": [34, -13.5], "우간다": [32.4, 1.4], "베네수엘라": [-66, 7], "그린란드": [-42, 72], "이란": [53, 32.5],
  "코스타리카": [-84, 9.9], "슬로바키아": [19.5, 48.7], "남아프리카공화국": [24.5, -29], "팔라우": [134.5, 7.5], "폴란드": [19.4, 52],
  "카타르": [51.2, 25.3], "사우디아라비아": [45, 24], "마카오": [113.55, 22.2], "포르투갈": [-8, 39.6], "체코": [15.5, 49.8], "아르메니아": [45, 40.2],

  "몬테네그로": [19.3, 42.7], "북마리아나 제도(미국령)": [145.7, 15.2], "과들루프(프랑스령)": [-61.55, 16.25], "모리타니": [-10.9, 20.3], "파라과이": [-58, -23], "콜롬비아": [-74, 4], "멕시코": [-102, 23], "쿠바": [-79.5, 21.6]
};
const ALL = DATA.bcs.map(b => ({ ...b, ...DATA.eps[b.k] })); // 회차별 공통 정보(부제·나라·테마·장소)를 방송 줄에 합친다
const PROG_NAME = { "걸세": "걸어서 세계속으로", "세테기": "세계테마기행" };
const BANDS = ["02-05", "05-08", "08-11", "11-14", "14-17", "17-20", "20-23", "23-02"]; // 앱 시간대 8칸(geoMapData.ts와 같다)
const LAST = ALL.reduce((a, b) => b.d > a ? b.d : a, ""); // 데이터의 마지막 방송일 — '최근 N개월'의 기준
const monthsBack = n => { const [y, m, d] = LAST.split("-").map(Number); const t = new Date(Date.UTC(y, m - 1 - n, d)); return t.toISOString().slice(0, 10); };
// 나라 → 권역: 한 나라만 다룬 방송에서 가장 많이 붙은 권역(권역 고르기에 쓴다)
const CREG = (() => {
  const c = new Map();
  for (const b of ALL) if (b.cs.length === 1) for (const r of b.rg) { const k = b.cs[0] + "|" + r; c.set(k, (c.get(k) || 0) + 1); }
  const best = new Map();
  for (const [k, n] of c) { const [cn, r] = k.split("|"); if (!best.has(cn) || best.get(cn)[1] < n) best.set(cn, [r, n]); }
  return new Map([...best].map(([k, v]) => [k, v[0]]));
})();

// ── 상태 ──
let prog = "all", theme = null, mode = "r", view = "country", zoom = null, focus = null, pick = null;
let per = "all", day = "all", band = "", minN = 0, reg = "", sortBy = "top";
let ITEMS = [];

// ── 집계(화면에서 방송 목록을 조건에 맞게 다시 묶는다) ──
const mean = xs => xs.length ? xs.reduce((a, b) => a + b, 0) / xs.length : NaN;
function stat(name, list, extra) {
  const eps = new Set(list.map(b => b.k)).size;
  return { name, list, n: list.length, eps, r: mean(list.map(b => b.r)), m: mean(list.map(b => b.m)), i: mean(list.map(b => b.i)), sample: list.length >= 3 && eps >= 2, ...extra };
}
function groupBy(list, keysOf) {
  const m = new Map();
  for (const b of list) for (const k of new Set(keysOf(b))) { if (!m.has(k)) m.set(k, []); m.get(k).push(b); }
  return [...m];
}
// 편성 조건(프로그램·기간·요일·시간대·권역)만 건 방송 — 테마 목록은 이것으로 센다
const since = () => per === "all" ? "" : monthsBack(+per);
function condList() {
  const s = since();
  return ALL.filter(b => (prog === "all" || b.p === prog) && (!s || b.d > s) && (day === "all" || (day === "we") === (b.wd === "토" || b.wd === "일")) && (!band || b.band === band) && (!reg || view === "region" || b.rg.includes(reg)));
}
const hasTheme = (b, t) => b.nat.includes(t) || b.cul.includes(t) || b.tm.includes(t);
const filtered = () => condList().filter(b => !theme || hasTheme(b, theme));
const countriesAgg = () => groupBy(filtered(), b => b.cs).filter(([n]) => CPOS[n] && (!reg || CREG.get(n) === reg)).map(([n, l]) => stat(n, l));
const regionsAgg = () => groupBy(filtered(), b => b.rg).filter(([n]) => POS[n]).map(([n, l]) => {
  const nat = l.filter(b => b.nat.length).length, cul = l.filter(b => b.cul.length).length, both = l.filter(b => b.nat.length && b.cul.length).length;
  return stat(n, l, { natureOnly: nat - both, cultureOnly: cul - both, both, neither: l.length - (nat + cul - both) });
});
// 도시·장소: 좌표를 모르는 장소는 나라 중앙에 두고(approx), 장소가 하나도 특정되지 않은 방송은 '(장소 미특정)' 한 덩어리로 묶는다.
const NOPLACE = "(장소 미특정)";
const placesOf = b => b.pl.filter(p => p[1] === zoom.name);
function placesAgg() {
  const m = new Map(), none = [], c0 = CPOS[zoom.name];
  for (const b of filtered()) {
    if (!b.cs.includes(zoom.name)) continue;
    const ps = placesOf(b);
    if (!ps.length) { none.push(b); continue; }
    for (const [n, , lon, lat] of ps) { if (!m.has(n)) m.set(n, { lon: lon ?? c0[0], lat: lat ?? c0[1], approx: lon == null, l: [] }); m.get(n).l.push(b); }
  }
  if (none.length) m.set(NOPLACE, { lon: c0[0], lat: c0[1], approx: true, l: none });
  return [...m].map(([n, o]) => ({ ...stat(n, o.l), lon: o.lon, lat: o.lat, approx: o.approx, sample: o.l.length >= 2 }));
}
const themesAgg = () => groupBy(condList(), b => [...b.nat.map(t => "N|" + t), ...b.cul.map(t => "C|" + t), ...b.tm.map(t => "S|" + t)]).map(([k, l]) => stat(k.slice(2), l, { kind: k[0] }));
function episodesAgg(list) {
  return groupBy(list, b => [b.k]).map(([k, l]) => {
    const f = l.find(b => b.ep != null) || l[0];
    return { ...stat(k, l), p: l[0].p, ep: f.ep, sub: l[0].sub, cs: l[0].cs, sample: true };
  });
}
function focusList() {
  let l = filtered();
  if (zoom) l = l.filter(b => b.cs.includes(zoom.name));
  if (focus && focus.type === "place") l = l.filter(b => focus.name === NOPLACE ? !placesOf(b).length : b.pl.some(p => p[0] === focus.name && p[1] === zoom.name));
  if (focus && focus.type === "region") l = l.filter(b => b.rg.includes(focus.name));
  return l;
}
// 최소 방송 횟수(5회+ 등)를 넘는 항목만 지도·순위에 남긴다
const items = () => (zoom ? placesAgg() : view === "region" ? regionsAgg() : countriesAgg()).filter(x => x.n >= minN);

// ── 성과 단계: 평균 대비 5단계. 시청률은 지금 범위의 평균 시청률, 지수는 1.00(같은 자리 평균)과 비교한다 ──
const CLS = [

  { k: "l", t: "낮음", d: "−4~12%", min: 0.88 },
  { k: "vl", t: "매우 낮음", d: "−12% 이상", min: -Infinity },
];
let BASE = 1, mapErr = "";
function setBase() { BASE = mean((zoom ? filtered().filter(b => b.cs.includes(zoom.name)) : filtered()).map(b => b.r)) || 1; }
const rel = x => mode === "r" ? x.r / BASE : x[mode];
const clsOf = x => CLS.find(c => rel(x) >= c.min);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const colorOf = x => css("--c-" + clsOf(x).k);

// ── 표시 ──
const pct = v => v.toFixed(3) + "%";
const idxName = () => mode === "i" ? "슬롯" : "월보정";
const modeName = () => mode === "r" ? "시청률" : idxName() + "지수";

const dPct = x => Math.round((rel(x) - 1) * 100);
function dTxt(x) {
  const p = dPct(x);
  if (!p) return '<span class="dl z">±0%</span>';
  return `<span class="dl ${p > 0 ? "u" : "d"}">${p > 0 ? "▲" : "▼"}${Math.abs(p)}%</span>`;
}
const byMode = (a, b) => (b.sample - a.sample) || (b[mode] - a[mode]); // 표본 충분한 항목 먼저, 참고용은 뒤로
const SORTS = {
  top: byMode,
  low: (a, b) => (b.sample - a.sample) || (a[mode] - b[mode]),
  air: (a, b) => (b.n - a.n) || (b[mode] - a[mode]),
  name: (a, b) => a.name.localeCompare(b.name, "ko"),

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

function dbar(x) {
  const d = rel(x) - 1, w = Math.min(1, Math.abs(d) / 0.3) * 50;
  return `<span class="dbar"><i class="${d >= 0 ? "pos" : "neg"}" style="left:${d >= 0 ? 50 : 50 - w}%;width:${Math.max(w, 0.8)}%;background:${colorOf(x)}"></i></span>`;
}
// 지금 걸린 조건을 한 줄로(제목·CSV에 쓴다)
function condText() {
  return [prog === "all" ? "" : PROG_NAME[prog], per === "all" ? "" : `최근 ${per === "12" ? "1년" : "6개월"}`, day === "all" ? "" : day === "we" ? "주말" : "평일",
    band ? band + "시" : "", reg && view !== "region" ? reg : "", minN ? `방송 ${minN}회+` : "", theme ? "#" + theme : ""].filter(Boolean).join(" · ");
}

// ── 지도: 태평양 중심(동경 150°) 메르카토르 — 유럽·아프리카 왼쪽, 아시아 가운데, 아메리카 오른쪽 ──
const W = 1200;
const proj = d3.geoMercator().rotate([-150, 0]).scale(W / (2 * Math.PI)).translate([W / 2, 0]);
const Y0 = proj([150, 78])[1], Y1 = proj([150, -58])[1], H = Y1 - Y0, CY = Y0 + H / 2;
const svg = d3.select("#map").attr("viewBox", `0 ${Y0} ${W} ${H}`).attr("preserveAspectRatio", "xMidYMid meet");
const path = d3.geoPath(proj);
const gWorld = svg.append("g").attr("class", "world");
let maxE = 1;
const sz = (e, lo, hi) => lo + (hi - lo) * Math.sqrt(Math.min(1, e.eps / maxE));
const radR = r => sz(r, 10, 26);
const radP = p => sz(p, 7, 20);
const radC = c => sz(c, 4.5, 16);
const rad = e => zoom ? radP(e) : view === "region" ? radR(e) : radC(e);
let tf = d3.zoomIdentity;
const posOf = e => view === "region" ? POS[e.name] : CPOS[e.name];

fetch("https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json").then(r => r.json()).then(topo => {
  const land = topojson.feature(topo, topo.objects.countries);
  gWorld.append("g").selectAll("path").data(land.features.filter(f => f.id !== "010")).join("path").attr("d", path)
    .attr("fill", "var(--land)").attr("stroke", "var(--land-line)").attr("stroke-width", .7).attr("vector-effect", "non-scaling-stroke");
  gWorld.lower();
}).catch(() => { mapErr = " · 지도 윤곽을 불러오지 못했습니다(인터넷 연결 확인)"; renderLegend(); });

let nodes = [];
function layout() {
  nodes = ITEMS.map(r => { const [x, y] = tf.apply(proj(zoom ? [r.lon, r.lat] : posOf(r))); return { r, ax: x, ay: y, x, y, rad: rad(r) + (view === "region" && !zoom ? 6 : 2) }; })
    .filter(n => n.ax > -30 && n.ax < W + 30 && n.ay > Y0 - 30 && n.ay < Y1 + 30);
  const sim = d3.forceSimulation(nodes)
    .force("x", d3.forceX(d => d.ax).strength(.12)).force("y", d3.forceY(d => d.ay).strength(.12))
    .force("c", d3.forceCollide(d => d.rad + 1.5).iterations(4)).stop();
  for (let i = 0; i < 300; i++) sim.tick();
  nodes.forEach(n => { n.x = Math.max(n.rad, Math.min(W - n.rad, n.x)); n.y = Math.max(Y0 + n.rad, Math.min(Y1 - n.rad, n.y)); });
}

const tip = document.getElementById("tip");
const selName = () => focus ? focus.name : null;
let TOP = new Map(); // 상위 5위(표본 충분한 항목만) — 이름 → 순위
function draw() {
  TOP = new Map(ITEMS.filter(x => x.sample).sort(byMode).slice(0, 5).map((x, i) => [x.name, i + 1]));
  labelSlots = placeLabels();
  svg.selectAll(".layer").remove();
  const g = svg.append("g").attr("class", "layer");
  g.selectAll("line").data(nodes.filter(n => Math.hypot(n.x - n.ax, n.y - n.ay) > n.rad)).join("line").attr("class", "lead")
    .attr("x1", d => d.ax).attr("y1", d => d.ay).attr("x2", d => d.x).attr("y2", d => d.y);
  // 큰 원부터 그리고, 상위 5위는 맨 위에(번호가 다른 원에 가리지 않게)
  const order = [...nodes].sort((a, b) => (TOP.has(a.r.name) - TOP.has(b.r.name)) || (b.r.eps - a.r.eps));
  const p = g.selectAll("g.pie").data(order).join("g").attr("class", "pie")
    .attr("transform", d => `translate(${d.x},${d.y})`)
    .on("click", (e, d) => select(d.r.name))
    .on("mousemove", (e, d) => showTip(e, d.r)).on("mouseleave", () => tip.style.opacity = 0);
  const arc = d3.arc(), pie = d3.pie().sort(null).value(d => d.v);
  p.each(function (d) {
    const r = d.r, ro = rad(r), gg = d3.select(this), c = colorOf(r), faint = !r.sample;
    if (view === "region" && !zoom) {
      const parts = [{ v: r.natureOnly, c: "--t-nat" }, { v: r.cultureOnly, c: "--t-cul" }, { v: r.both, c: "--t-both" }, { v: r.neither, c: "--none" }].filter(x => x.v > 0);
      gg.append("circle").attr("r", ro + 4).attr("fill", "none").attr("stroke", c).attr("stroke-width", selName() === r.name ? 8 : 5).attr("stroke-dasharray", faint ? "3 3" : null);
      gg.selectAll("path").data(pie(parts)).join("path").attr("d", a => arc.innerRadius(0).outerRadius(ro)(a)).attr("fill", a => `var(${a.data.c})`).attr("stroke", "var(--surface)").attr("stroke-width", 1.2);
    } else {
      gg.append("circle").attr("r", ro).attr("fill", c).attr("fill-opacity", faint ? .38 : 1).attr("stroke", "var(--surface)").attr("stroke-width", 1.5);
      if (faint || r.approx) gg.append("circle").attr("r", ro + .5).attr("fill", "none").attr("stroke", "var(--muted)").attr("stroke-width", 1).attr("stroke-dasharray", "2 2");
      if (selName() === r.name) gg.append("circle").attr("r", ro + 3.5).attr("fill", "none").attr("stroke", "var(--ink)").attr("stroke-width", 2.5);
    }
    const rk = TOP.get(r.name);
    if (rk) { // 상위 5위: 파란 원 안에 순위 숫자(원 오른쪽 위)
      const o = (ro + (view === "region" && !zoom ? 4 : 0)) * .72, b = gg.append("g").attr("class", "rk").attr("transform", `translate(${o + 2},${-o - 2})`);
      b.append("circle").attr("r", 9);
      b.append("text").attr("y", .5).text(rk);
    }
  });
  drawLabels(g);
  applyDim(null);
}
// 이름표 배치: 상위 5위·큰 원부터 아래→위→오른쪽→왼쪽 순으로 다른 이름표·원과 겹치지 않는 자리를 찾는다(겹치면 생략, 마우스를 올리면 이름이 뜬다)
let labelSlots = null;
function placeLabels() {
  const placed = [], out = new Map(), regionPie = view === "region" && !zoom;
  const overlap = (a, b) => a.x0 < b.x1 && a.x1 > b.x0 && a.y0 < b.y1 && a.y1 > b.y0;
  const hitsCircle = (bx, o) => { const cx = Math.max(bx.x0, Math.min(o.x, bx.x1)), cy = Math.max(bx.y0, Math.min(o.y, bx.y1)); return Math.hypot(cx - o.x, cy - o.y) < rad(o.r) * 0.9; };
  // 1차: 다른 이름표·원과 겹치지 않는 자리. 2차: 회차가 많은 곳(6편+)·상위 5위는 작은 원 위에 걸쳐도 이름을 낸다(이름은 원 위 층에 그려 가리지 않는다)
  const order = [...nodes].sort((a, b) => (TOP.has(b.r.name) - TOP.has(a.r.name)) || (b.r.eps - a.r.eps));
  for (const pass of [1, 2]) for (const d of order) {
    const r = d.r;
    if (out.has(r.name) || (pass === 2 && !(TOP.has(r.name) || r.eps >= 6))) continue;
    // 회차 수와 관계없이 모든 나라에 이름을 시도한다(모리타니처럼 작은 원도) — 자리가 없을 때만 생략
    const txt = regionPie ? `${r.name} ${mainVal(r)}` : r.name, w = txt.length * 11 + 2, h = 15, ro = rad(r) + (regionPie ? 6 : 0), q = ro * .72 + 3;
    const cands = [
      { dx: 0, dy: ro + 12, a: "middle", x0: -w / 2, y0: ro + 1 }, { dx: 0, dy: -ro - 4, a: "middle", x0: -w / 2, y0: -ro - 14 },
      { dx: ro + 4, dy: 4, a: "start", x0: ro + 4, y0: -8 }, { dx: -ro - 4, dy: 4, a: "end", x0: -ro - 4 - w, y0: -8 },
      // 대각선 네 곳(오른쪽 위는 상위 5위 번호 자리라 그 원에서는 쓰지 않는다)
      { dx: q, dy: q + 9, a: "start", x0: q, y0: q - 2 }, { dx: -q, dy: q + 9, a: "end", x0: -q - w, y0: q - 2 },
      ...(TOP.has(r.name) ? [] : [{ dx: q, dy: -q, a: "start", x0: q, y0: -q - 11 }]), { dx: -q, dy: -q, a: "end", x0: -q - w, y0: -q - 11 },
    ];
    for (const c of cands) {
      const bx = { x0: d.x + c.x0, x1: d.x + c.x0 + w, y0: d.y + c.y0, y1: d.y + c.y0 + h };
      if (bx.x0 < 0 || bx.x1 > W || placed.some(p => overlap(p, bx)) || (pass === 1 && nodes.some(o => o !== d && hitsCircle(bx, o))) || hitsCircle(bx, d)) continue;
      placed.push(bx); out.set(r.name, { ...c, txt }); break;
    }
  }
  return out;
}
// 이름표는 모든 원을 그린 뒤 맨 위 층에 그린다(뒤에 그려진 작은 원에 가리지 않게)
function drawLabels(g) {
  g.append("g").attr("class", "lbls").selectAll("text").data(nodes.filter(d => labelSlots.has(d.r.name))).join("text").attr("class", "lbl")
    .attr("x", d => d.x + labelSlots.get(d.r.name).dx).attr("y", d => d.y + labelSlots.get(d.r.name).dy)
    .style("text-anchor", d => labelSlots.get(d.r.name).a).text(d => labelSlots.get(d.r.name).txt);
}
// 흐리게: 회차에 마우스를 올리면 그 회차의 나라(장소)만, 아니면 범례에서 고른 단계만 남긴다
function applyDim(names) {
  const off = d => names ? !names.has(d.r.name) : !!pick && clsOf(d.r).k !== pick;
  svg.selectAll("g.pie").classed("dim", off);
  svg.selectAll("text.lbl").classed("dim", off);
}

function epLines(list, n) {
  return '<div class="eg">' + episodesAgg(list).sort((a, b) => b[mode] - a[mode]).slice(0, n)
    .map(e => `<div class="e"><b>${esc(epLabel(e))}</b><span>${esc(e.sub)}</span><span>${mainVal(e)}</span>${dTxt(e)}</div>`).join("") + "</div>";
}
function showTip(e, r) {
  const c = clsOf(r), rk = TOP.get(r.name);
  tip.innerHTML = `<div class="hd"><b>${rk ? rk + "위 · " : ""}${esc(r.name)}</b>${zoom ? `<span class="ref">${esc(zoom.name)}</span>` : ""}<span class="cchip"><i style="background:${colorOf(r)}"></i>${c.t} ${dTxt(r)}</span></div>` +
    `<div class="st num">시청률 <b>${pct(r.r)}</b> · 월보정 ${r.m.toFixed(2)} · 슬롯 ${r.i.toFixed(2)}<br>방송 ${r.n}건 · 회차 ${r.eps}편${r.sample ? "" : " · <b>표본 적음</b>"}</div>` +
    (view === "region" && !zoom ? `<div class="st">자연만 ${r.natureOnly} · 문화만 ${r.cultureOnly} · 둘 다 ${r.both} · 분류 없음 ${r.neither}</div>` : "") +
    `<div class="h">잘 나온 회차 (${modeName()} 순)</div>${epLines(r.list, 6)}` +
    (r.eps > 6 ? `<div class="h">외 ${r.eps - 6}편 — 누르면 오른쪽 '잘 나온 회차'에 전부</div>` : "") +
    (zoom && r.approx ? `<div class="h">정확한 위치를 아직 모릅니다 — ${esc(zoom.name)} 중앙에 표시</div>` : "") +
    (!zoom && view === "country" ? `<div class="h">누르면 도시·장소별로 확대</div>` : "");
  tip.style.opacity = 1;
  const w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = Math.max(8, Math.min(innerWidth - w - 8, e.clientX + 16)) + "px";
  tip.style.top = Math.max(8, Math.min(innerHeight - h - 8, e.clientY + 16)) + "px";
}

function select(name) {
  if (view === "country" && !zoom) { zoomTo(name); return; }
  focus = focus && focus.name === name ? null : { type: zoom ? "place" : "region", name };
  draw(); renderRank(); renderEpisodes(); syncCtl();
}
// ── 확대·이동: d3.zoom 하나로 휠·드래그·버튼·국가 확대를 처리한다 ──
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const EXT = [[0, Y0], [W, Y1]];
const zb = d3.zoom().scaleExtent([1, 14]).extent(EXT).translateExtent(EXT).clickDistance(4)
  .filter(e => e.type === "wheel" ? true : (!e.button && e.type !== "dblclick"))
  .on("start", () => { tip.style.opacity = 0; })
  .on("zoom", e => { tf = e.transform; gWorld.attr("transform", tf); syncCtl(); scheduleDraw(); })
  .on("end", () => { if (zoom && zoom.k0 > 1.3 && tf.k < zoom.k0 * 0.55) { zoom = null; focus = null; refresh(); } });
svg.call(zb).on("dblclick.zoom", null);
document.getElementById("map").addEventListener("wheel", e => e.preventDefault(), { passive: false });
let drawQ = 0;
function scheduleDraw() { if (!drawQ) drawQ = requestAnimationFrame(() => { drawQ = 0; layout(); draw(); }); }
const go = (t, ms = 650) => svg.transition().duration(reduceMotion ? 0 : ms).call(zb.transform, zb.constrain()(t, EXT, EXT));
const fit = (k, cx, cy) => d3.zoomIdentity.translate(W / 2 - k * cx, CY - k * cy).scale(k);
function syncCtl() {
  const zoomed = !!zoom || tf.k > 1.01;
  document.getElementById("crumb").hidden = !zoomed;
  document.getElementById("crumbNow").textContent = zoom ? zoom.name + (focus ? " › " + focus.name : "") : "확대 중";
  document.getElementById("zhome").disabled = !zoomed;
  document.getElementById("zin").disabled = tf.k >= 13.9;
  document.getElementById("zout").disabled = tf.k <= 1.01;
  svg.classed("zoomed", tf.k > 1.01);
}
function zoomTo(name) {
  zoom = { name, k0: 1 };
  const pts = placesAgg().filter(p => !p.approx).map(p => proj([p.lon, p.lat]));
  pts.push(proj(CPOS[name]));
  const xs = pts.map(q => q[0]), ys = pts.map(q => q[1]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  const k = Math.max(1, Math.min(W * 0.78 / Math.max(x1 - x0, 60), H * 0.78 / Math.max(y1 - y0, 40), 9));
  zoom.k0 = k; focus = null; pick = null;
  go(fit(k, (x0 + x1) / 2, (y0 + y1) / 2));
  refresh();
}
function zoomOut() {
  zoom = null; focus = null; pick = null;
  go(d3.zoomIdentity, 500);
  refresh();
}

let RANKED = []; // 지금 순위표(CSV 내려받기에 쓴다)
function renderRank() {
  const rs = [...ITEMS].sort(SORTS[sortBy]);
  RANKED = rs;
  const unit = zoom ? zoom.name + " 도시·장소" : view === "region" ? "권역" : "국가";
  document.getElementById("rankTitle").textContent = `${unit} ${rs.length}곳 · ${modeName()}`;
  document.getElementById("axVal").textContent = mode === "r" ? "시청률" : "지수";
  const ul = d3.select("#rank"); ul.selectAll("li").remove();
  const split = sortBy === "top" || sortBy === "low"; // 성과순일 때만 표본 적은 항목을 아래로 떼어 번호를 매기지 않는다
  let n = 0, sepDone = false;
  rs.forEach(r => {
    if (split && !r.sample && !sepDone) { sepDone = true; ul.append("li").attr("class", "sep").html(`<span class="term" data-term="s">표본 적음</span> — 참고용, 순위에서 제외`); }
    const li = ul.append("li").attr("class", [selName() === r.name ? "sel" : "", r.sample ? "" : "few", pick && clsOf(r).k !== pick ? "dim" : ""].join(" "))
      .on("click", () => select(r.name)).on("mousemove", e => showTip(e, r)).on("mouseleave", () => tip.style.opacity = 0);
    li.append("span").attr("class", "no num").text(!split || r.sample ? ++n : "");
    li.append("span").attr("class", "nm").attr("title", `${r.name} · 방송 ${r.n}건`).html(`${esc(r.name)}${sortBy === "air" ? `<small>${r.n}회</small>` : ""}`);
    li.append("span").html(dbar(r));
    li.append("span").attr("class", "val").text(mainVal(r));
    li.append("span").html(dTxt(r));
  });
  if (!rs.length) ul.append("li").attr("class", "empty").text(minN ? `방송 ${minN}회 이상인 곳이 없습니다 — '방송' 조건을 낮춰 보세요.` : "해당하는 방송이 없습니다.");
}
function downloadCsv() {
  const q = s => `"${String(s).replace(/"/g, '""')}"`;
  const head = ["순위", zoom ? "장소" : view === "region" ? "권역" : "국가", "방송 수", "회차 수", "평균 시청률(%)", "월보정지수", "슬롯지수", `평균 대비(%)`, "단계", "표본"];
  const split = sortBy === "top" || sortBy === "low";
  let k = 0;
  const rows = RANKED.map(r => [!split || r.sample ? ++k : "", r.name, r.n, r.eps, r.r.toFixed(4), r.m.toFixed(3), r.i.toFixed(3), dPct(r), clsOf(r).t, r.sample ? "충분" : "적음"]);
  const meta = [`# OLIFE 시청률 지도 · ${DATA.target} · ${DATA.period} · 기준 ${modeName()} · 조건: ${condText() || "전체"}${zoom ? " · " + zoom.name : ""}`];
  const blob = new Blob(["﻿" + [...meta, head.map(q).join(","), ...rows.map(r => r.map(q).join(","))].join("\r\n")], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = `OLIFE_시청률지도_${zoom ? zoom.name : view === "region" ? "권역" : "국가"}_순위.csv`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function renderEpisodes() {
  const list = focusList();
  const es = episodesAgg(list).sort((a, b) => b[mode] - a[mode]);
  const scope = [condText(), zoom ? zoom.name : "", focus ? focus.name : ""].filter(Boolean).join(" · ");
  document.getElementById("epTitle").textContent = `${scope || "전체"} · ${es.length}편`;
  const ul = d3.select("#eps"); ul.selectAll("li").remove();
  es.slice(0, 60).forEach((e, n) => {
    const li = ul.append("li")
      .on("mouseenter", () => applyDim(new Set(zoom ? e.list.flatMap(b => { const ps = placesOf(b); return ps.length ? ps.map(p => p[0]) : [NOPLACE]; }) : view === "region" ? e.list.flatMap(b => b.rg) : e.cs)))
      .on("mouseleave", () => applyDim(null));
    li.append("span").attr("class", "no num").text(n + 1);
    li.append("span").html(`<span class="prog ${e.p}">${esc(epLabel(e))}</span>`);
    const airs = e.list.map(b => `${+b.d.slice(5, 7)}/${+b.d.slice(8)}(${b.wd}) ${b.t}`).join(", ");
    li.append("span").attr("class", "tt").html(`<div title="${esc(e.sub)}">${esc(e.sub)}</div><div class="m">${esc(e.cs.join("·"))} · 방송 ${e.n}회: ${esc(airs)}</div>`);
    li.append("span").attr("class", "vv").html(`<span class="val">${mainVal(e)}</span>${dTxt(e)}`);
  });
  if (!es.length) ul.append("li").html('<span></span><span></span><span class="ref">해당하는 방송이 없습니다.</span>');
}
function renderKpis() {
  const l = filtered(), eps = new Set(l.map(b => b.k)).size;
  const byP = p => mean(l.filter(b => b.p === p).map(b => b.r));
  document.getElementById("k1").textContent = l.length ? pct(mean(l.map(b => b.r))) : "-";
  document.getElementById("k1s").textContent = ["걸세", "세테기"].filter(p => prog === "all" || prog === p).map(p => `${p} ${isNaN(byP(p)) ? "-" : pct(byP(p))}`).join(" · ");
  document.getElementById("k2").textContent = `${l.length.toLocaleString()}건`;
  document.getElementById("k2s").textContent = `회차 ${eps.toLocaleString()}편 · 나라 ${new Set(l.flatMap(b => b.cs)).size}곳`;
  const top = ITEMS.filter(x => x.sample).sort(byMode)[0];
  document.getElementById("k3t").textContent = zoom ? "1위 장소" : view === "region" ? "1위 권역" : "1위 나라";
  document.getElementById("k3").textContent = top ? top.name : "-";
  document.getElementById("k3").title = top ? top.name : "";
  document.getElementById("k3s").textContent = top ? `${mainVal(top)} · 방송 ${top.n}건` : "표본 충분한 곳 없음";
  const c = condText();
  const rb = document.getElementById("reset");
  rb.hidden = !(per !== "all" || day !== "all" || band || minN || reg);
  rb.title = c ? `지금 조건: ${c} · 방송 ${l.length.toLocaleString()}건` : "";
}
function renderLegend() {
  document.getElementById("legTitle").textContent = (mode === "r" ? `색 = 평균 ${pct(BASE)} 대비` : "색 = 1.00(같은 자리 평균) 대비") + mapErr;
  const cnt = k => ITEMS.filter(x => clsOf(x).k === k).length;
  const box = d3.select("#legRows"); box.selectAll("*").remove();
  CLS.forEach(c => box.append("button").attr("class", "lrow").attr("aria-pressed", pick === c.k)
    .attr("title", `${c.t}: ${c.d}${pick === c.k ? " — 다시 누르면 모두 표시" : " — 누르면 이 단계만 표시"}`)
    .html(`<i class="sw" style="background:var(--c-${c.k})"></i>${c.t}<span class="cnt num">${cnt(c.k)}</span>`)
    .on("click", () => { pick = pick === c.k ? null : c.k; renderLegend(); applyDim(null); renderRank(); }));
}
function renderThemes() {
  const q = document.getElementById("q").value.trim();
  const ts = themesAgg().filter(t => !q || t.name.includes(q)).sort(byMode);
  const box = d3.select("#chips"); box.selectAll("*").remove();
  ts.forEach(t => box.append("button").attr("class", "chip " + t.kind).attr("aria-pressed", theme === t.name)
    .attr("title", `${t.kind === "N" ? "자연 테마" : t.kind === "C" ? "문화 테마" : "시기·명절"} · 방송 ${t.n}건 · 회차 ${t.eps}편`) // 건수는 마우스오버로(칩을 좁혀 한 줄에 여러 개)
    .html(`<b>${esc(t.name)}</b> <small>${mode === "r" ? pct(t.r) : t[mode].toFixed(2)}</small>`)
    .on("click", () => setTheme(theme === t.name ? null : t.name)));
  if (!ts.length) box.append("span").attr("class", "ref").text("맞는 테마가 없습니다.");
}
function setTheme(t) {
  theme = t; focus = null; pick = null;
  const b = document.getElementById("themeOn"); b.hidden = !t; b.textContent = t ? `#${t} ✕` : "";
  if (zoom && !filtered().some(x => x.cs.includes(zoom.name))) zoomOut(); else refresh();
}
function refresh() {
  ITEMS = items(); maxE = Math.max(...ITEMS.map(x => x.eps), 1); setBase();
  document.getElementById("reg").hidden = view === "region";
  layout(); draw(); renderRank(); renderEpisodes(); renderKpis(); renderThemes(); renderLegend(); syncCtl();
}
function press(attr, v) { document.querySelectorAll(`[data-${attr}]`).forEach(b => b.setAttribute("aria-pressed", b.dataset[attr] === v)); }

// ── 조작 ──
document.querySelectorAll("[data-prog]").forEach(b => b.onclick = () => { prog = b.dataset.prog; press("prog", prog); focus = null; pick = null; refresh(); });
document.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => { mode = b.dataset.mode; press("mode", mode); pick = null; refresh(); });
document.querySelectorAll("[data-view]").forEach(b => b.onclick = () => {
  view = b.dataset.view; press("view", view); zoom = null; focus = null; pick = null; svg.interrupt().call(zb.transform, d3.zoomIdentity); refresh();
});
// 편성 조건: 바뀌면 확대 중인 나라에 방송이 남는지 보고, 없으면 세계지도로 돌아간다
function condChanged() { focus = null; pick = null; if (zoom && !filtered().some(x => x.cs.includes(zoom.name))) zoomOut(); else refresh(); }
document.querySelectorAll("[data-per]").forEach(b => b.onclick = () => { per = b.dataset.per; press("per", per); condChanged(); });
document.querySelectorAll("[data-day]").forEach(b => b.onclick = () => { day = b.dataset.day; press("day", day); condChanged(); });
document.querySelectorAll("[data-min]").forEach(b => b.onclick = () => { minN = +b.dataset.min; press("min", b.dataset.min); condChanged(); });
const bandSel = document.getElementById("band"), regSel = document.getElementById("reg");
for (const x of BANDS) bandSel.add(new Option(x + "시", x));
for (const x of Object.keys(POS)) if ([...CREG.values()].includes(x)) regSel.add(new Option(x, x));
bandSel.onchange = () => { band = bandSel.value; condChanged(); };
regSel.onchange = () => { reg = regSel.value; if (zoom) zoomOut(); else condChanged(); };
document.getElementById("reset").onclick = () => {
  per = "all"; day = "all"; band = ""; minN = 0; reg = ""; bandSel.value = ""; regSel.value = "";
  press("per", "all"); press("day", "all"); press("min", "0"); condChanged();
};
document.getElementById("sort").onchange = e => { sortBy = e.target.value; renderRank(); };
document.getElementById("csv").onclick = downloadCsv;
for (const [id, fn] of [["crumbHome", zoomOut], ["zhome", zoomOut],
  ["zin", () => svg.transition().duration(reduceMotion ? 0 : 250).call(zb.scaleBy, 1.7)],
  ["zout", () => svg.transition().duration(reduceMotion ? 0 : 250).call(zb.scaleBy, 1 / 1.7)]]) document.getElementById(id).onclick = fn;
document.getElementById("themeOn").onclick = () => setTheme(null);
document.getElementById("q").addEventListener("input", renderThemes);
document.getElementById("q").addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  const q = e.target.value.trim(); const t = themesAgg().filter(t => q && t.name.includes(q)).sort(byMode)[0];
  if (t) setTheme(t.name);
});
addEventListener("keydown", e => {
  if (e.target.closest && e.target.closest("input, select, textarea")) return;
  const zoomed = zoom || tf.k > 1.01;
  if ((e.key === "Escape" || e.key === "Home" || e.key === "0") && zoomed) zoomOut();
  else if (e.key === "+" || e.key === "=") document.getElementById("zin").click();
  else if (e.key === "-" || e.key === "_") document.getElementById("zout").click();
});

// ── 용어 설명 ──
const TERMS = {
  r: ["시청률", "선택한 타깃(가구·2049 등)의 닐슨 시청률. 색은 지금 범위의 평균 시청률 대비입니다. 편성 요일·시간대 차이까지 걷어낸 비교는 지수를 보세요."],
  i: ["슬롯지수", "그 방송 시청률 ÷ 같은 프로그램·같은 요일·같은 시간대 방송들의 평균. 1.00 = 그 자리 평균, 1.15 = 평균보다 15% 높음."],
  m: ["월보정지수", "슬롯지수와 같지만 비교 평균을 같은 달 방송으로 한정한 값. 계절·시기 영향까지 걷어내 '이 회차 자체가 잘 나왔는지' 보는 데 좋습니다. 1.00 = 평균."],
  s: ["표본 적음", "방송이 3건 미만이거나 서로 다른 회차가 2편 미만(장소는 방송 2건 미만)이면 우연일 수 있어 흐리게 그리고 순위 번호를 매기지 않습니다."],
  data: ["데이터 안내", () => `<span class="hl">&lt;걸어서 세계속으로&gt;·&lt;세계테마기행&gt; · ${esc(DATA.period)} · ${esc(DATA.target)} · 분류표와 맞은 방송 ${ALL.length.toLocaleString()}건</span>` +
    `<span class="hl">같은 회차의 재방송은 한 줄로 묶어 평균했습니다. 2025-02 이후 방송은 편성표로 회차를 이었고, 수기 분류표에 없는 회차는 회차 제목의 나라·테마로 자동 분류했습니다(장소·세부 테마는 부정확할 수 있음).</span>` +
    `<span class="hl">여러 회차를 묶어 방송한 칸은 묶음 전체의 시청률을 각 회차에 같이 적용했습니다.</span>`],
  legend: ["보는 법", () => `<span class="hl">색 = 평균 대비. 시청률 기준이면 지금 범위(세계 = 지금 조건 전체, 나라 확대 = 그 나라)의 평균과, 지수 기준이면 1.00(같은 자리 평균)과 비교합니다.</span>` +
    `<span class="hl">색 단계: 매우 높음 +12% 이상 · 높음 +4~12% · 평균 수준 ±4% 안 · 낮음 −4~12% · 매우 낮음 −12% 이상 (색 단계를 누르면 그 단계만 표시)</span>` +
    `<span class="hl">원 크기 = 회차 수 · <b style="color:var(--top)">파란 숫자</b> = 상위 5위</span><span class="hl">흐린 원 = 표본 적음 · 점선 = 위치 미확인(나라 중앙에 표시)</span>` +
    (view === "region" && !zoom ? `<span class="hl">권역 원그래프: <i class="dot" style="background:var(--t-nat)"></i>자연만 <i class="dot" style="background:var(--t-cul)"></i>문화만 <i class="dot" style="background:var(--t-both)"></i>둘 다 <i class="dot" style="background:var(--none)"></i>분류 없음 · 바깥 테두리 색 = 성과</span>` : "") +
    `<span class="hl">마우스 = 잘 나온 회차 · 클릭 = 도시·장소로 확대 · 휠 = 확대/축소 · ESC = 복귀</span>`],
};
const tt = document.getElementById("termTip");
function showTerm(el) {
  const d = TERMS[el.dataset.term]; if (!d) return;
  tt.innerHTML = `<b>${d[0]}</b><br>${typeof d[1] === "function" ? d[1]() : d[1]}`; tt.style.opacity = 1;
  const r = el.getBoundingClientRect(), w = tt.offsetWidth, h = tt.offsetHeight;
  tt.style.left = Math.max(8, Math.min(innerWidth - w - 8, r.left)) + "px";
  tt.style.top = (r.bottom + 8 + h > innerHeight ? Math.max(8, r.top - h - 8) : r.bottom + 8) + "px";
}
const hideTerm = () => { tt.style.opacity = 0; };
document.addEventListener("mouseover", e => { const el = e.target.closest && e.target.closest(".term"); el ? showTerm(el) : hideTerm(); });
document.addEventListener("focusin", e => { const el = e.target.closest && e.target.closest(".term"); if (el && el.matches(":focus-visible")) showTerm(el); else hideTerm(); });
document.addEventListener("mouseout", e => { if (e.target.closest && e.target.closest(".term") && !(e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest(".term"))) hideTerm(); });
document.addEventListener("focusout", hideTerm);
addEventListener("scroll", () => { tip.style.opacity = 0; }, true);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", refresh);

// 타깃 선택: 앱 안에서는 ?t=타깃 으로 다시 불러온다(서버가 타깃별로 계산). 내려받은 단독 HTML에서는 바꿀 수 없다.
const sel = document.getElementById("target");
for (const t of DATA.targets || [DATA.target]) { const o = document.createElement("option"); o.value = t; o.textContent = t === "전국 유료가구" ? "가구" : t; o.title = t; o.selected = t === DATA.target; sel.appendChild(o); }
if (location.protocol.startsWith("http")) sel.onchange = () => { location.search = "?t=" + encodeURIComponent(sel.value); };
else { sel.disabled = true; sel.title = "타깃 변경은 에이전트의 시청률 지도 화면에서만 됩니다"; }

// 지도 칸 높이: 지도 비율(가로 꽉 채움)대로 하되 한 화면(스크롤 없이)에 들어오게 줄이고, 오른쪽 패널은 지도와 같은 높이로 맞춘다
function fitStage() {
  const mc = document.querySelector(".mapcard"), side = document.querySelector(".side");
  if (innerWidth <= 1000) { mc.style.height = ""; side.style.height = ""; return; }
  const room = innerHeight - mc.getBoundingClientRect().top - 8;
  mc.style.height = Math.round(Math.max(320, Math.min(mc.clientWidth * H / W, room))) + "px";
  side.style.height = Math.max(mc.offsetHeight, 520) + "px";
}
// 순위 패널 접기(지도를 너비 가득) — 보는 사람 브라우저에만 기억한다
const stageEl = document.querySelector(".stage"), panelBtn = document.getElementById("panel");
function setWide(on) {
  stageEl.classList.toggle("wide", on);
  panelBtn.setAttribute("aria-pressed", on); panelBtn.textContent = on ? "⇤" : "⇥";
  panelBtn.title = on ? "오른쪽 순위 패널 다시 펴기" : "오른쪽 순위 패널 접기 — 지도를 화면 너비 가득";
  try { localStorage.setItem("geoMapWide", on ? "1" : ""); } catch (e) {}
  fitStage(); scheduleDraw();
}
panelBtn.onclick = () => setWide(!stageEl.classList.contains("wide"));
// 전체 화면(앱 안 iframe은 allow="fullscreen"이 있어야 뜬다)
const fullBtn = document.getElementById("full");
if (document.fullscreenEnabled) {
  fullBtn.hidden = false;
  fullBtn.onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
  document.addEventListener("fullscreenchange", () => { fullBtn.title = document.fullscreenElement ? "전체 화면 끝내기" : "전체 화면"; fitStage(); scheduleDraw(); });
}
fitStage(); addEventListener("resize", () => { fitStage(); scheduleDraw(); });
refresh();
let wide0 = false; try { wide0 = localStorage.getItem("geoMapWide") === "1"; } catch (e) {}
if (wide0) setWide(true); else fitStage();
</script>
</body>
</html>
