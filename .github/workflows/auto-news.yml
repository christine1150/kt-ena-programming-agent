name: 주요 뉴스 자동 게시

# 2026-11-15: 홈 '주요 뉴스'를 매일 아침 자동으로 교체한다(사용자 지시 — 08시 전에 바뀌어 있으면 된다).
# 호출하는 엔드포인트는 /api/cron/auto-news. 오늘 이미 바뀌었거나 관리자가 직접 올린 날은 엔드포인트가 스스로 건너뛴다.
# 저장소 시크릿 CRON_SECRET(Vercel 환경변수와 같은 값)이 필요하다 — nielsen-mail-check.yml과 같은 시크릿.

# 2026-11-25: 10:30 추가 갱신(?mode=refresh)도 함께 부른다 — Vercel 무료 요금제 크론은 정시에 돌지 않아(11/25 10:30 예약이 11:04에 실행)
# 먼저 도는 쪽만 반영되고 나중 쪽은 엔드포인트가 "오늘 추가 갱신을 이미 마쳤습니다"로 건너뛴다.

on:
  schedule:
    - cron: "25 22 * * *" # UTC 22:25 = KST 07:25(GitHub 예약은 몇 분~수십 분 늦을 수 있어 조금 이르게 잡는다)
    - cron: "25 1 * * *" # UTC 01:25 = KST 10:25 — 추가 갱신
  workflow_dispatch: {}

jobs:
  auto-news:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 자동 게시 엔드포인트 호출
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "::error::저장소 시크릿 CRON_SECRET이 비어 있습니다. Settings > Secrets and variables > Actions 에서 Vercel의 CRON_SECRET과 같은 값을 추가하세요."; exit 1; fi
          query=""
          if [ "$SCHEDULE" = "25 1 * * *" ]; then query="?mode=refresh"; fi
          echo "호출: /api/cron/auto-news$query"
          http_code=$(curl -sS --max-time 150 -H "Authorization: Bearer $CRON_SECRET" -o response.json -w "%{http_code}" "https://kt-ena-programming-agent.vercel.app/api/cron/auto-news$query")
          echo "HTTP $http_code"
          cat response.json
          if [ "$http_code" != "200" ]; then
            echo "::error::엔드포인트가 실패 응답을 반환했습니다 (HTTP $http_code) — 위 응답 본문 참고."
            exit 1
          fi
