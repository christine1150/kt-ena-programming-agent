name: Nielsen 메일 자동 확인(아침 집중 구간)

# 사용자 지시(2026-09-06): "일일 시청률이 7시 50분쯤 오는 경우도 있으니 7시 40분 이후
# 메일이 오면 즉시 반영" — 이 프로젝트의 Vercel 요금제(Hobby)는 하루 1회를 초과하는
# 크론을 지원하지 않아(배포 시 "Hobby accounts are limited to daily cron jobs"로
# 거부됨), 대신 이 저장소의 GitHub Actions 무료 스케줄러로 07:30~09:30(KST) 사이
# 5분마다 기존 /api/cron/fetch-nielsen-mail 엔드포인트를 호출한다(추가 비용 없음).
# Vercel 자체 크론(매일 08:00 KST 1회, vercel.json)은 안전망으로 그대로 둔다 — 이
# 워크플로가 어떤 이유로 실패해도 하루 한 번은 보장된다.
#
# 정직하게 밝히는 한계:
# - GitHub Actions의 schedule 트리거는 "정확히 그 시각"을 보장하지 않는다 — GitHub
#   서버 부하에 따라 실행이 몇 분 지연되거나(공식 문서에 명시된 동작) 드물게 건너뛸
#   수 있다. "몇 분 안에 즉시"를 최대한 근접하게 흉내내는 것이지 완전한 실시간은 아니다.
# - 이 저장소에 60일 이상 커밋이 없으면 GitHub가 예약 워크플로를 자동으로 비활성화한다
#   (다시 커밋하거나 Actions 탭에서 수동으로 재활성화하면 복구됨).
# - 엔드포인트 자체가 message_id 기준 중복 처리 방지를 이미 하고 있어(mail_ingestion_log),
#   같은 메일을 여러 번 호출해도 두 번 적재되지 않는다 — 5분마다 호출해도 안전하다.

# 2026-10-18 점검(10/18 08:09 도착 메일이 11:12 수동 확인 때까지 반영되지 않음):
# - 원인 1: 10/16부터 이 워크플로가 매번 실패했다 — 저장소 시크릿 CRON_SECRET이 비어 있어 엔드포인트를 호출하지도 못했다(10/15 크론 인증 강화 이후).
#   Vercel 크론은 시크릿을 자동으로 붙여 정상이라, 매일 08:00 KST 무렵 한 번만 확인되고 그 뒤에 온 메일은 아무도 확인하지 않았다.
# - 원인 2: GitHub 예약 실행은 하루 세 번 안팎만 돌았고(10/13~10/18 실측, 첫 실행이 09:36~10:19 KST) 정각·5분 단위 시각에 몰려 밀린다.
#   → 정각·5분 배수를 피한 시각(3분부터 5분 간격)으로 바꾸고 창을 10:59까지 늘렸다. 그래도 GitHub가 건너뛸 수 있어 Vercel 크론도 하루 두 번(08:00·09:30 KST 무렵, vercel.json)으로 늘렸다.
on:
  schedule:
    - cron: "33-58/5 22 * * *" # KST 07:33~07:58
    - cron: "3-58/5 23 * * *" # KST 08:03~08:58
    - cron: "3-58/5 0 * * *" # KST 09:03~09:58
    - cron: "3-58/5 1 * * *" # KST 10:03~10:58
  workflow_dispatch: {} # 수동 실행(디버깅/즉시 확인용)

jobs:
  check-mail:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Nielsen 메일 자동 수집 엔드포인트 호출
        # 2026-10-15: 크론 엔드포인트가 CRON_SECRET 없이는 거부되도록 바뀌었다 — 저장소 시크릿 CRON_SECRET(Vercel 환경변수와 같은 값)이 필요하다.
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "::error::저장소 시크릿 CRON_SECRET이 비어 있습니다. Settings > Secrets and variables > Actions 에서 Vercel의 CRON_SECRET과 같은 값을 추가하세요."; exit 1; fi
          http_code=$(curl -sS --max-time 180 -H "Authorization: Bearer $CRON_SECRET" -o response.json -w "%{http_code}" "https://kt-ena-programming-agent.vercel.app/api/cron/fetch-nielsen-mail")
          echo "HTTP $http_code"
          cat response.json
          if [ "$http_code" != "200" ]; then
            echo "::error::엔드포인트가 실패 응답을 반환했습니다 (HTTP $http_code) — 위 응답 본문 참고."
            exit 1
          fi
